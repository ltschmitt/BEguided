[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beguided"
version = "0.1.0"
description = "Cas9 Base Editor Guide RNA Generator"
requires-python = ">=3.10"

[project.scripts]
beguided = "beguided.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["beguided*"]

# ---------------------------------------------------------------------------
# Pixi workspace configuration
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["pytorch", "conda-forge", "bioconda"]
name = "beguided"
platforms = ["linux-64"]

[tool.pixi.tasks]
beguided = "python -m beguided.cli"
test = "python -m pytest tests/ -v"

# Core runtime dependencies (synced with [project.dependencies])
[tool.pixi.dependencies]
numpy = ">=2.4.3,<3"
biopython = ">=1.87,<2"
pandas = ">=3.0.2,<4"
intervaltree = ">=3.1.0,<4"
pyyaml = ">=6.0.3,<7"
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"
python-multipart = ">=0.0.9"
jinja2 = ">=3.1.0"
openpyxl = ">=3.1.0"
pytorch = ">=2.5.1,<3"
numba = ">=0.65.1,<0.66"
pysam = ">=0.24.0,<0.25"

# ---------------------------------------------------------------------------
# Optional Pixi features
# ---------------------------------------------------------------------------
# Test dependencies (installed in default environment)
[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.3,<10"
httpx = ">=0.27.0"

# CUDA support for GPU-accelerated off-target search (Linux only)
# Install with: pixi install --features cuda
[tool.pixi.feature.cuda.dependencies]
pytorch-cuda = ">=12.4,<13"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }
cuda = { features = ["cuda", "test"], solve-group = "default" }
