[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beguided"
version = "0.1.0"
description = "Cas9 Base Editor Guide RNA Generator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.4.3,<3",
    "biopython>=1.87,<2",
    "pandas>=3.0.2,<4",
    "intervaltree>=3.1.0,<4",
    "pyyaml>=6.0.3,<7",
    "openpyxl>=3.1.0",
]

[project.scripts]
beguided = "beguided.cli:main"
beguided-web = "beguided.web.cli:main"

[project.optional-dependencies]
# Heavy scientific-stack deps kept out of the default install. Nothing in
# the beguided package imports torch or numba, so the CPU web/CLI images
# don't need them. Install explicitly with `pip install ".[gpu]"` when
# you need them locally (e.g. for GPU experimentation).
gpu = [
    "torch>=2.5.1,<3",
    "numba>=0.65.1,<0.66",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
]
test = [
    "pytest>=9.0.3",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["beguided*"]

[tool.setuptools.package-data]
"beguided.editing.data" = ["*.tsv"]
"beguided.web.static" = ["vendor/*.js"]

# ---------------------------------------------------------------------------
# Pixi workspace configuration
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["pytorch", "conda-forge", "bioconda"]
name = "beguided"
platforms = ["linux-64"]

[tool.pixi.tasks]
beguided = "python -m beguided"
beguided-web = "python -m beguided.web.cli"
test = "python -m pytest tests/ -v"

# Core runtime dependencies (synced with [project.dependencies])
[tool.pixi.dependencies]
numpy = ">=2.4.3,<3"
biopython = ">=1.87,<2"
pandas = ">=3.0.2,<4"
intervaltree = ">=3.1.0,<4"
pyyaml = ">=6.0.3,<7"
openpyxl = ">=3.1.0"

# ---------------------------------------------------------------------------
# Optional Pixi features
# ---------------------------------------------------------------------------
# Web dependencies (for the FastAPI web server)
# Install with: pixi install --features web
[tool.pixi.feature.web.dependencies]
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"
python-multipart = ">=0.0.9"
jinja2 = ">=3.1.0"

# Test dependencies (installed in default environment)
[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.3,<10"
httpx = ">=0.27.0"

# CUDA support for GPU-accelerated off-target search (Linux only)
# Install with: pixi install --features cuda
#
# `pytorch-cuda` is the CUDA runtime meta-package; the actual `pytorch`
# Python wheel (with CUDA bindings) must also be listed or `beguidedoff`
# imports fail with `ModuleNotFoundError: No module named 'torch'`.
# These packages are intentionally **not** in `[project.optional-dependencies]
# gpu` to keep the Docker install slim (avoids pulling torch into the
# container image); only the pixi `cuda` env adds them.
[tool.pixi.feature.cuda.dependencies]
pytorch = ">=2.5.1,<3"
pytorch-cuda = ">=12.4,<13"
numba = ">=0.65.1,<0.66"
pysam = ">=0.24.0,<0.25"

# BEguidedOFF (off-target search) is installed from its public GitHub repo.
# Its CPU FM-index binding is a native extension built at install time against
# sdsl-lite; the required build tools come from the shared `beguidedoff-build`
# feature below, and the build runs inside the pixi environment
# (`no-build-isolation`), where BEguidedOFF's setup.py finds the conda
# sdsl-lite via sys.prefix automatically. To hack on BEguidedOFF locally,
# temporarily swap the git source for
# `beguidedoff = { path = "../BEguidedOFF", editable = true }`.
[tool.pixi.feature.cuda.pypi-dependencies]
beguidedoff = { git = "https://github.com/ltschmitt/BEguidedOFF.git" }

# BEguidedOFF fast mode (CPU FM-index off-target search) for GPU-less
# environments such as the web server. Same GitHub install as the cuda
# feature, but without torch/numba — BEguidedOFF's base install is CPU-only
# by design.
[tool.pixi.feature.fast.pypi-dependencies]
beguidedoff = { git = "https://github.com/ltschmitt/BEguidedOFF.git" }

# Build-time dependencies for BEguidedOFF's native FM-index extension
# (conda-forge sdsl-lite + compiler toolchain). Shared by the cuda and web
# environments via the `beguidedoff-build` feature. `zlib` is the link-time
# library (the runtime comes in via `libzlib`).
[tool.pixi.feature.beguidedoff-build.dependencies]
sdsl-lite = "*"
pybind11 = "*"
setuptools = "*"
zlib = "*"
cxx-compiler = "*"

# Build BEguidedOFF inside the pixi environment so its setup.py discovers the
# conda-provided sdsl-lite via sys.prefix; an isolated build environment would
# not see it.
[tool.pixi.pypi-options]
no-build-isolation = ["beguidedoff"]

# ---------------------------------------------------------------------------
# Activation environment (applies to pixi run/shell and to pypi installs)
# ---------------------------------------------------------------------------
[tool.pixi.activation.env]
# BEguidedOFF's optional CUDA kernel extension is never part of these envs
# (the extensive GPU mode ships without it, as before). Setting 0 makes the
# skip deterministic on hosts where nvcc + CUDA happen to be visible to the
# build, where the extension build would otherwise be attempted (and fail).
BEGUIDEDOFF_CUDA = "0"
# The FM-index binding must match the C++ ABI of conda-forge's libsdsl (the
# C++11 ABI). If a build environment ever exposes torch/nvcc to BEguidedOFF's
# setup.py, torch's BuildExtension would compile the binding against an
# old-ABI default and it would fail to import against libsdsl with
# "undefined symbol: sdsl::util::file_size". distutils appends $CFLAGS last,
# so this define wins over any inherited default.
CFLAGS = "-D_GLIBCXX_USE_CXX11_ABI=1"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }
cuda = { features = ["cuda", "test", "beguidedoff-build"], solve-group = "default" }
web = { features = ["web", "test", "fast", "beguidedoff-build"], solve-group = "default" }
