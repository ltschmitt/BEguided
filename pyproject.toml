[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beguided"
version = "0.1.0"
description = "Cas9 Base Editor Guide RNA Generator"
requires-python = ">=3.10"

[project.scripts]
beguided = "beguided.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["beguided*"]

# ---------------------------------------------------------------------------
# Pixi workspace configuration (all deps managed by Pixi, not pip)
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["pytorch", "conda-forge", "bioconda"]
name = "beguided"
platforms = ["linux-64"]

[tool.pixi.tasks]
beguided = "python -m beguided.cli"
test = "python -m pytest tests/ -v"

# BEguidedOFF installed from private GitLab via SSH
[tool.pixi.pypi-dependencies]
beguidedoff = { git = "ssh://git@gitlab.mn.tu-dresden.de/buchholzlab/beguidedoff.git" }

# All runtime dependencies managed by Pixi (conda/PyPI)
[tool.pixi.dependencies]
numpy = ">=2.4.3,<3"
biopython = ">=1.87,<2"
pandas = ">=3.0.2,<4"
pytest = ">=9.0.3,<10"
intervaltree = ">=3.1.0,<4"
pyyaml = ">=6.0.3,<7"
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"
python-multipart = ">=0.0.9"
jinja2 = ">=3.1.0"
openpyxl = ">=3.1.0"
pytorch = ">=2.5.1,<3"
numba = ">=0.65.1,<0.66"
pysam = ">=0.24.0,<0.25"
pytorch-cuda = ">=12.4,<13"
