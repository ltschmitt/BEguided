# BEguided legal-page content.
#
# This file is committed to the repo as a SCHEMA REFERENCE ONLY — copy it
# to ``legal.yaml``, fill in the real values, and mount that file into the
# container at the path given by ``BEGUIDED_LEGAL_CONFIG`` (default
# /etc/beguided/legal.yaml). ``legal.yaml`` MUST NOT be committed.
#
# Every field is optional. If the file is absent at startup the server
# logs a WARNING and serves the legal pages with empty values. If the
# file is present but malformed (invalid YAML, wrong top-level type,
# unknown variable reference) the server fails fast.
#
# Variable reuse: every value may contain Jinja expressions that
# reference the other values in this file, so a fact is defined once
# and placed in many paragraphs. References are resolved to a fixed
# point, so definition order does not matter. A reference to a
# variable that is not defined anywhere in this file aborts startup.
#
# Block fields (controller_block, dpo_block, dpa_block,
# access_contact_block, enforcement_body_block) define a full
# multi-line paragraph as a single value. They accept a list of lines
# or a multi-line string; either way the value is rendered as one Jinja
# template (so loops over other list fields, e.g. address_lines, work)
# and split into lines. Each rendered line is HTML-escaped and tokens
# starting with mailto:, http:// or https:// become hyperlinks —
# mailto links are shown without the "mailto:" prefix.
#
# Required German legal disclosures (TMG/DDG §5, GDPR Art. 13/14,
# BfWebG/BITV 2.0) are documented in compliance_safety.md.

# ---------------------------------------------------------------------
# Base facts — define each once; referenced by the templates and by
# the block paragraphs below.
# ---------------------------------------------------------------------

# Full legal name of the controller (e.g. university, institute, faculty).
institution_name: ""

# Postal address as a list of lines. Rendered as <br>-separated lines.
address_lines: []

# Public contact email (must be reachable; required by §5 TMG/DDG).
contact_email: ""

# Public contact phone (optional but recommended).
contact_phone: ""

# Public URL of this site, as shown on the accessibility statement.
website_url: ""

# Head of the institution / department responsible for the service
# (imprint "Technical implementation").
head_of_institution: ""

# Higher-level institution that technically hosts the service
# (imprint "Technical implementation"; e.g. the university when the
# institute is a department).
hosting_legal_name: ""

# Department / subdivision within the institution (imprint hosting
# sentence).
institution_department: ""

# Person responsible for the content of the service (imprint, per
# § 18 MStV); usually the PI / head of the institute. May reference
# other values in this file.
content_responsible: ""

# Person who technically implemented the web service (imprint). Tokens
# starting with mailto:/http(s):// become hyperlinks.
technical_implementer: ""

# Imprint lead phrase: "The Legal Notice of <host> applies with the
# following amendments:". When the URL is set, the name is a hyperlink.
# Leave both empty when the notice is not referenced from another one.
legal_notice_host: ""
legal_notice_host_url: ""

# Free-form date strings shown on the legal pages.
last_updated: ""
accessibility_prepared: ""
accessibility_reviewed: ""

# How long reverse-proxy / web-server logs are kept (separate from the
# job-database retention enforced by the app itself).
log_retention_days: 7

# ---------------------------------------------------------------------
# Full-paragraph blocks. Each is ONE value for the whole paragraph.
# ---------------------------------------------------------------------

# Data Protection Declaration §1 "Controller": name, address, contact.
# Example demonstrating reuse of the base facts:
#   controller_block:
#     - "{{ institution_name }}"
#     - "{% for line in address_lines %}{{ line }}\n{% endfor %}"
#     - "Email: mailto:{{ contact_email }}"
controller_block: []

# Data Protection Declaration §2 "Data Protection Officer".
dpo_block: []

# Data Protection Declaration §7: competent supervisory authority
# (Landesdatenschutzbeauftragte[r]), including contact details.
dpa_block: []

# Accessibility statement: "Feedback and contact information" block.
access_contact_block: []

# Accessibility statement: "Enforcement procedure" block (the
# state's enforcement body for IT accessibility, incl. contact).
enforcement_body_block: []
