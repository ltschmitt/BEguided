# BEguided legal-page content.
#
# This file is committed to the repo as a SCHEMA REFERENCE ONLY — copy it
# to ``legal.yaml``, fill in the real values, and mount that file into the
# container at the path given by ``BEGUIDED_LEGAL_CONFIG`` (default
# /etc/beguided/legal.yaml). ``legal.yaml`` MUST NOT be committed.
#
# Every field is optional. If the file is absent at startup the server
# logs a WARNING and serves the legal pages with empty values. If the
# file is present but malformed (invalid YAML, wrong top-level type)
# the server fails fast.
#
# Required German legal disclosures (TMG/DDG §5, GDPR Art. 13/14) are
# documented in compliance_safety.md.

# Full legal name of the controller (e.g. university, institute, faculty).
institution_name: ""

# Postal address as a list of lines. Rendered as <br>-separated lines.
address_lines: []

# Person authorised to represent the institution (e.g. rector, dean, PI).
vertretungsberechtigter: ""

# Public contact email (must be reachable; required by §5 TMG/DDG).
contact_email: ""

# Public contact phone (optional but recommended).
contact_phone: ""

# Hosting provider disclosure (§5 TMG/DDG requires the hosting provider).
hosting_provider: ""

# Person responsible for content under § 18 MStV (usually the PI).
content_responsible_mstv: ""

# Data Protection Officer (Datenschutzbeauftragter).
dpo_name: ""
dpo_email: ""
dpo_address: []

# Competent supervisory authority (Landesdatenschutzbeauftragte[r]).
# Rendered as a multi-line address block in the privacy policy under
# "You have the right to appeal to the supervisory authority at any time
# (Art. 77 GDPR)". Every field is optional and individually guarded in
# the template; leave unused ones empty.
#
# Example for Saxony:
#   competent_dpa: "Saxon Data Protection and Transparency Officer"
#   competent_dpa_head: "Dr. Juliane Hundert"
#   competent_dpa_address:
#     - "Postfach 11 01 32"
#     - "01330 Dresden"
#   competent_dpa_email: "post@sdtb.sachsen.de"
#   competent_dpa_phone: "+49 (0) 351 85471 101"
#   competent_dpa_web: "https://www.datenschutz.sachsen.de"
competent_dpa: ""
competent_dpa_head: ""
competent_dpa_address: []
competent_dpa_email: ""
competent_dpa_phone: ""
competent_dpa_web: ""

# How long reverse-proxy / web-server logs are kept (separate from the
# 24h job-database retention enforced by the app itself).
log_retention_days: 7

# Free-form date string shown on every legal page (e.g. "2026-07-23").
last_updated: ""

# --- Imprint: lead phrase ---------------------------------------------
# Renders as: "The Legal Notice of <legal_notice_host> applies with the
# following amendments:". When `legal_notice_host_url` is set, the host
# name is wrapped in an <a href="…"> link. When either field is empty
# the template renders nothing — there is no fallback.
# Example for a TU Dresden institute:
#   legal_notice_host: "TU Dresden"
#   legal_notice_host_url: "https://tu-dresden.de/impressum"
legal_notice_host: ""
legal_notice_host_url: ""

# --- Imprint: Responsibilities — content contact ----------------------
# Full name of the person to contact for content questions. Rendered as
# the first line of the address block under "If you have any questions
# regarding content, please contact:".
content_contact_name: ""

# --- Imprint: Responsibilities — technical implementation -------------
# Higher-level institution name (typically "Technische Universität
# Dresden" for TU Dresden institutes).
hosting_legal_name: ""

# Department / subdivision within the institution (e.g. "Faculty of
# Medicine Carl Gustav Carus"). Rendered as the second line of the
# technical-implementation address block.
institution_department: ""

# Postal address lines for the technical-implementation address block.
hosting_legal_postal: []

# Head of the department / institution responsible for the service.
# Rendered as "Head: <head_of_institution>".
head_of_institution: ""

# Contact email for the technical-implementation address block.
hosting_legal_email: ""
