# BEguided Pipeline Configuration Template
# Copy this file and fill in your local paths before running:
#   beguided --config your_config.yaml

# =============================================================================
# INPUT FILES
# =============================================================================
input:
  # Target mutations file (TSV format)
  # Required columns: chromosome, position, target_base, desired_base
  targets: "path/to/targets.tsv"

  # Reference genome (FASTA format, optionally bgzipped/FAI-indexed)
  # Used for guide generation and bystander analysis (steps 1-3)
  genome: "path/to/genome.fa"

  # Base editor profiles (TSV format)
  # Default: configs/base_editor_profiles.tsv
  base_editor_profiles: "configs/base_editor_profiles.tsv"

  # GFF/GTF annotation file for transcript/CDS information
  # Required for bystander analysis (unless keep_bystanders=none)
  gff_file: "path/to/annotation.gtf"

# =============================================================================
# OUTPUT
# =============================================================================
# Output directory. All files are written directly into this directory with
# fixed step filenames (step1_guidefinder.tsv, step2_bystander.tsv, etc.).
output_prefix: "./pipeline_results/run1"

# Keep intermediate files (step1-4 TSVs)
keep_intermediates: true

# Pass non-core columns from the input targets TSV through to all step outputs
# and the final beguided_results.tsv. The four core columns are always
# chromosome, position, target_base, desired_base — any other columns in the
# input TSV are treated as "extras". Set to false to drop them.
# Default: true
passthrough_extras: true

# Keep one row per input target in the final beguided_results.tsv even when no
# guide RNA could be designed (no valid PAM / all guides filtered out) or the
# target's mutation type does not match the selected base editors.
# Placeholder rows keep the input identity + bases columns; their
# guide_rna_sequence is "**No guide possible**" or "**Base change incompatible**"
# and every other result field is empty. Rows are only added in the very last
# step, never during processing. The web server always enables this.
# Default: false
keep_targets_without_guides: false

# =============================================================================
# GUIDEFINDER
# =============================================================================
# Which base editor profiles to use
# Options: "all", "all ABEs", "all CBEs", or comma-separated profile names (e.g. "ABE8e,ABE9")
#   "all"        -> every profile from base_editor_profiles.tsv
#   "all ABEs"   -> only ABE (A-to-G / T-to-C) profiles
#   "all CBEs"   -> only CBE (C-to-T / G-to-A) profiles
use_base_editors: "all"

# =============================================================================
# FILTERING / BYSTANDERS
# =============================================================================
# Filter mode for guide selection:
#   "all"         -> keep all guides
#   "none"        -> only guides with zero bystander edits
#   "synonymous"  -> guides with synonymous bystanders or no bystanders
keep_bystanders: "all"

# On-target score filter (CRISPRater).
# Guides with guide_score below this value are removed in step 3.
# Value must be between 0 and 1 (higher = better score).
# Set to 0 to disable filtering by on-target score.
guide_score_threshold: 0.5

# GC content filter for the 20-nt protospacer.
# Options:
#   "off"         -> do not filter by GC content (default; returns every guide)
#   "high"        -> keep guides with GC between 40% and 60%
#   "medium"      -> keep guides with GC between 30% and 70%
# The deprecated names "good" (= high) and "acceptable" (= medium) are still
# accepted.
# Guides with a missing GC value are always kept.
gc_content_filter: "off"

# Drop guides that contain a homopolymer run of 4 or more identical bases.
# Both AAAA/TTTT (Pol III termination signal) and CCCC/GGGG runs are flagged.
# Set to true to drop them, false to keep everything (default).
filter_homopolymers: false

# Minimum trinucleotide edit-context score (Marquart et al. 2021, ABE8e,
# normalised 0..1) below which ABE guides are dropped in step 3.
# The score reflects how likely the local X-A-Y context is to be edited
# (e.g. CAC = 1.0, AAA = 0.02). CBE rows are always kept — the table is
# ABE-only and their trinuc_edit_score is NaN by construction. Set to null
# (or omit) to disable the filter.
trinuc_edit_score_min: null

# =============================================================================
# OFF-TARGET SCREENING (Steps 4-5)
# =============================================================================
# Set to false to skip BEguidedOFF off-target search
search_offtargets: true

offtargets:
  # Search mode: "extensive" (GPU brute force; the default for CLI configs)
  # or "fast" (CPU FM-index filter, no GPU needed — this is what the web
  # server uses). In fast mode the search cutoff is derived from
  # remove_guides_score / count_threshold_score; max_mismatches is ignored.
  # mode: "extensive"

  # Path to the BEguidedOFF-encoded genome (.npz file).
  # Required for "extensive" mode. In "fast" mode it is only used to derive
  # the default FM-index path (same basename, .fmi suffix) when index_path
  # is empty.
  # Encode once with: python -m beguidedoff.cli encode-genome --fasta genome.fa --output genome.npz
  beguidedoff_genome: "path/to/genome.npz"

  # FM-index (.fmi) for "fast" mode. Empty/unset = derived from the .npz
  # path (same basename, .fmi suffix).
  # Build once with: python -m beguidedoff.cli build-index genome.fa genome.fmi
  # index_path: "path/to/genome.fmi"

  # Maximum mismatches allowed in the 20-nt guide region ("extensive" mode
  # only). "mismatch_tolerance" is still accepted as a legacy alias.
  max_mismatches: 5

  # CCTOP score threshold for COUNTING off-targets.
  # Only off-targets with score <= this value are included in offtarget_count.
  # Higher CCTOP = less concerning. Default: 15.0
  count_threshold_score: 15.0

  # Minimum CCTOP score to KEEP a guide.
  # Guides whose worst off-target has a score < this value are removed.
  # Default: 5.0 (guides with very likely off-targets are discarded)
  remove_guides_score: 5.0

  # Maximum off-target count to KEEP a guide (null = no limit).
  # NOTE: the code default when this key is omitted is 100; the explicit
  # null here disables the count limit.
  remove_guides_n_offtargets: null
