# BEguided web server — CPU (no CUDA).
#
# Build the `web` target from the repo Dockerfile and run the FastAPI server
# on http://localhost:8000.
#
# Usage:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f web
#   docker compose down
#
# Configuration:
#   Every deployment knob is interpolated from a shell env var with a
#   sensible default, so `docker compose up` works with no environment
#   file at all. Per-host overrides go in `docker-compose.override.yml`
#   or are exported in the shell before `docker compose up`.
#
#   GENOME_HOST_DIR            Host directory with the reference FASTA + GTF.
#                              Default: ./genome.
#   PORT                       Host port to publish. Default: 8000.
#   BEGUIDED_GENOME_LABEL      Human assembly label shown in the UI selector
#                              as "Homo sapiens (<label>)". Default: GRCh38.
#   BEGUIDED_MOUSE_GENOME_LABEL Mouse assembly label shown as
#                              "Mus musculus (<label>)". Default: GRCm39.
#   BEGUIDED_DEFAULT_GENOME    Genome selected by default: human|mouse.
#                              Default: human.
#   BEGUIDED_LEGAL_CONFIG      Path to legal.yaml inside the container.
#                              Default: /etc/beguided/legal.yaml (mounted
#                              from ./legal.yaml if present).
#
# Off-target screening: the image installs BEguidedOFF from GitHub
# (https://github.com/ltschmitt/BEguidedOFF, CPU fast mode only). Screening
# activates per genome once the index files exist under /app/genome —
# default below expects hg38_beguidedoff.{npz,fmi,fmi.meta}; until then
# /config reports the genome as unavailable and the UI's off-target
# controls show a clear error. Override with BEGUIDED_BEGUIDEDOFF_GENOME /
# _INDEX (or the per-genome _HUMAN/_MOUSE variants; see docs/installation.md).

services:
  web:
    build:
      context: .
      target: web
    image: beguided:web
    container_name: beguided-web
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - "${GENOME_HOST_DIR:-./genome}:/app/genome:ro"
      # The operator's web-legal.yaml is gitignored. The committed template
      # at configs/web-legal.yaml is empty and is NOT loaded by default —
      # the operator creates their own file and points at it via
      # BEGUIDED_LEGAL_CONFIG + a bind mount.
      - ./legal.yaml:/etc/beguided/legal.yaml:ro
      - beguided-jobs:/var/lib/beguided
      # Optional: keep the monthly usage-statistics CSVs directly on the
      # host instead of copying them out of the container. Uncomment and
      # set BEGUIDED_USAGE_STATS_PATH=/var/lib/beguided/usage/usage_stats.csv.
      # - ./usage_stats:/var/lib/beguided/usage
    environment:
      PYTHONUNBUFFERED: "1"
      BEGUIDED_BASE_EDITOR_PROFILES_FILE: "${BEGUIDED_BASE_EDITOR_PROFILES_FILE:-/app/configs/base_editor_profiles.tsv}"
      BEGUIDED_GENOME_FASTA: "${BEGUIDED_GENOME_FASTA:-/app/genome/Homo_sapiens.GRCh38.116.fa}"
      BEGUIDED_GTF_PATH: "${BEGUIDED_GTF_PATH:-/app/genome/Homo_sapiens.GRCh38.116.gtf}"
      BEGUIDED_MOUSE_GENOME_FASTA: "${BEGUIDED_MOUSE_GENOME_FASTA:-/app/genome/Mus_musculus.GRCm39.2026_04.fa}"
      BEGUIDED_MOUSE_GTF_PATH: "${BEGUIDED_MOUSE_GTF_PATH:-/app/genome/Mus_musculus.GRCm39.2026_04.gtf}"
      BEGUIDED_BEGUIDEDOFF_GENOME: "${BEGUIDED_BEGUIDEDOFF_GENOME:-/app/genome/hg38_beguidedoff.npz}"
      BEGUIDED_DB_PATH: "${BEGUIDED_DB_PATH:-/var/lib/beguided/jobs.db}"
      BEGUIDED_PRELOAD_GENOME: "${BEGUIDED_PRELOAD_GENOME:-true}"
      BEGUIDED_PRELOAD_GTF: "${BEGUIDED_PRELOAD_GTF:-true}"
      BEGUIDED_GENOME_LABEL: "${BEGUIDED_GENOME_LABEL:-GRCh38}"
      BEGUIDED_MOUSE_GENOME_LABEL: "${BEGUIDED_MOUSE_GENOME_LABEL:-GRCm39}"
      BEGUIDED_DEFAULT_GENOME: "${BEGUIDED_DEFAULT_GENOME:-human}"
      BEGUIDED_LEGAL_CONFIG: "${BEGUIDED_LEGAL_CONFIG:-/etc/beguided/legal.yaml}"
      # Scheduler knobs (previously hardcoded in the command: block).
      BEGUIDED_QUEUE_MAX: "${BEGUIDED_QUEUE_MAX:-16}"
      BEGUIDED_COOLDOWN_SECONDS: "${BEGUIDED_COOLDOWN_SECONDS:-15}"
      BEGUIDED_MAX_UPLOAD_MB: "${BEGUIDED_MAX_UPLOAD_MB:-1}"
      BEGUIDED_MAX_INPUT_TARGETS: "${BEGUIDED_MAX_INPUT_TARGETS:-500}"
      BEGUIDED_WORKERS: "${BEGUIDED_WORKERS:-1}"
      # Compliance knobs. The two secrets MUST be set per host (the
      # defaults here are placeholders that should be overridden).
      BEGUIDED_TRUSTED_PROXY_IPS: "${BEGUIDED_TRUSTED_PROXY_IPS:-127.0.0.1,::1}"
      BEGUIDED_JOB_RETENTION_HOURS: "${BEGUIDED_JOB_RETENTION_HOURS:-24}"
      BEGUIDED_ADMIN_TOKEN: "${BEGUIDED_ADMIN_TOKEN:-}"
      BEGUIDED_LOG_IP_SALT: "${BEGUIDED_LOG_IP_SALT:-}"
      # Anonymous usage statistics (one CSV row per finished web job; no IP,
      # no user-agent, date granularity only). Written under the persisted
      # beguided-jobs volume so it survives rebuilds; set the path to a
      # bind-mount target to read the CSV directly on the host.
      BEGUIDED_USAGE_STATS_PATH: "${BEGUIDED_USAGE_STATS_PATH:-/var/lib/beguided/usage_stats.csv}"
      BEGUIDED_USAGE_STATS_ENABLED: "${BEGUIDED_USAGE_STATS_ENABLED:-true}"
    command:
      - beguided-web
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    restart: unless-stopped

volumes:
  beguided-jobs:
