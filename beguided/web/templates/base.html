<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BEguided — CRISPR base editor guide RNA design tool.">
    <title>{% block title %}BEguided{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="container">
        {% block header %}{% endblock %}
        <main id="main" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer" role="contentinfo">
            <div class="site-footer-top">
                <nav aria-label="Legal">
                    <a href="/impressum">Imprint</a>
                    <a href="/datenschutz">Privacy</a>
                    <a href="/agb">Terms of Use</a>
                    <a href="/accessibility">Accessibility</a>
                </nav>
                <nav aria-label="Partner institutions" class="site-footer-partners">
                    <a href="https://tu-dresden.de/" target="_blank" rel="noopener noreferrer">
                        <img src="/static/logo_tu_dresden.svg"
                             alt="TU Dresden"
                             class="site-footer-partner-logo">
                    </a>
                    <a href="https://www.buchholzlab.org/" target="_blank" rel="noopener noreferrer">
                        <img src="/static/logo_buchholz_lab.svg"
                             alt="Buchholz Lab"
                             class="site-footer-partner-logo">
                    </a>
                </nav>
            </div>
            <p class="site-footer-meta">
                BEguided is a research tool. Do not upload personally
                identifying human genomic data.
            </p>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
